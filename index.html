<title>Exhibidor Boulogne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* App de una columna para teléfono: barra superior con el título de la sección, contenido, barra de navegación fija abajo. */
:root {
  --bg: #f1f3f0;
  --surface: #ffffff;
  --sunken: #e7ebe6;
  --fg: #142019;
  --muted: #5b6a62;
  --line: #d6ddd7;
  --accent: #1f5c52;
  --accent-soft: #dcebe6;
  --accent-fg: #ffffff;
  --ok: #1d6b40;
  --ok-bg: #dff0e5;
  --warn: #8a5900;
  --warn-bg: #f9edcc;
  --err: #a7261d;
  --err-bg: #f8e1de;
  --scrim: rgba(8, 16, 12, 0.5);
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412;
    --surface: #18201c;
    --sunken: #121915;
    --fg: #e5ece8;
    --muted: #93a39a;
    --line: #2a352f;
    --accent: #7cc4b4;
    --accent-soft: #1d3530;
    --accent-fg: #0b1a16;
    --ok: #7fd3a0;
    --ok-bg: #173223;
    --warn: #e9c165;
    --warn-bg: #352b12;
    --err: #f4a39a;
    --err-bg: #3b1f1b;
    --scrim: rgba(0, 0, 0, 0.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412;
  --surface: #18201c;
  --sunken: #121915;
  --fg: #e5ece8;
  --muted: #93a39a;
  --line: #2a352f;
  --accent: #7cc4b4;
  --accent-soft: #1d3530;
  --accent-fg: #0b1a16;
  --ok: #7fd3a0;
  --ok-bg: #173223;
  --warn: #e9c165;
  --warn-bg: #352b12;
  --err: #f4a39a;
  --err-bg: #3b1f1b;
  --scrim: rgba(0, 0, 0, 0.62);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-inline: 16px;
  padding-block: 0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 600px; margin-inline: auto; }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- barra superior ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  margin-inline: -16px; padding: 14px 16px 10px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
}
.top-txt { min-width: 0; }
.eyebrow { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.top h1 { font-size: 1.5rem; line-height: 1.15; font-weight: 700; margin: 2px 0 0; letter-spacing: -0.02em; text-wrap: balance; }
.top-btn {
  flex: 0 0 auto; min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer;
  background: var(--accent); color: var(--accent-fg); border: 0; font-weight: 600; font-size: 0.92rem;
}
.volver {
  display: inline-flex; align-items: center; gap: 2px; background: none; border: 0; padding: 6px 0; margin-bottom: 2px;
  color: var(--accent); font-weight: 600; font-size: 0.95rem; cursor: pointer; min-height: 36px;
}

/* ---------- navegación inferior ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-in { max-width: 600px; margin-inline: auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
.nav-btn {
  background: none; border: 0; cursor: pointer; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 0.74rem; font-weight: 600;
}
.nav-ico { width: 52px; height: 28px; border-radius: 999px; display: grid; place-items: center; }
.nav-ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn[aria-current="page"] { color: var(--fg); }
.nav-btn[aria-current="page"] .nav-ico { background: var(--accent-soft); color: var(--accent); }

/* ---------- avisos ---------- */
.banner {
  display: flex; flex-direction: column; gap: 8px;
  background: var(--warn-bg); color: var(--warn);
  padding: 12px; border-radius: 12px; font-size: 0.88rem; margin-bottom: 14px;
}
.banner .acciones { display: flex; gap: 8px; flex-wrap: wrap; }
.banner button {
  font-size: 0.85rem; font-weight: 600; background: transparent; border: 1px solid currentColor; color: inherit;
  border-radius: 8px; padding: 0 12px; min-height: 38px; cursor: pointer;
}
.toast {
  position: fixed; left: 16px; right: 16px; z-index: 20;
  bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom, 0px));
  max-width: 568px; margin-inline: auto;
  padding: 12px 14px; border-radius: 12px; font-size: 0.92rem; font-weight: 500;
  background: var(--fg); color: var(--bg);
}
.toast.err { background: var(--err); color: var(--surface); }

/* ---------- tira de fechas ---------- */
.fechas {
  display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity;
  margin-inline: -16px; padding: 2px 16px 12px; scrollbar-width: none;
}
.fechas::-webkit-scrollbar { display: none; }
.dia {
  flex: 0 0 auto; scroll-snap-align: start; cursor: pointer;
  width: 64px; padding: 8px 0 9px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.dia-mes { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.dia-num { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.dia-n { font-size: 0.66rem; color: var(--muted); }
.dia-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 4px; background: var(--line); }
.dia-dot.ok { background: var(--ok); }
.dia-dot.warn { background: var(--warn); }
.dia-dot.error { background: var(--err); }
.dia[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.dia[aria-pressed="true"] .dia-mes, .dia[aria-pressed="true"] .dia-n { color: var(--accent-fg); opacity: 0.85; }
.dia[aria-pressed="true"] .dia-dot { box-shadow: 0 0 0 2px var(--accent-fg); }

.resumen-dia { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin: 2px 0 12px; }
.resumen-dia strong { font-size: 1.05rem; }
.resumen-dia span { color: var(--muted); font-size: 0.88rem; }

.aviso-box { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 4px; }
.aviso-box textarea {
  font: inherit; font-size: 0.92rem; line-height: 1.45; width: 100%; min-height: 190px; padding: 10px 12px; resize: vertical;
  color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; user-select: text;
}
.wa {
  border: 0; cursor: pointer; width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; border-radius: 10px; margin: 6px 0 4px; text-decoration: none;
  background: var(--accent); color: var(--accent-fg); font-weight: 600;
}
.wa svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.turno.n-susp { border-style: dashed; background: transparent; }
.turno.n-susp .hora { opacity: 0.55; }
.link-susp { display: block; margin: 0 0 0 auto; background: none; border: 0; color: var(--muted); font-size: 0.8rem; font-weight: 500; min-height: 36px; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.btn.ancho { width: 100%; }
.dia-dot.susp { background: transparent; border: 1.5px solid var(--muted); }
.res-info { color: var(--muted); font-size: 0.8rem; }

/* ---------- selector de semana (Fijos) ---------- */
.semanas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--sunken); padding: 4px; border-radius: 12px; margin-bottom: 10px; }
.sem {
  border: 0; background: transparent; cursor: pointer; border-radius: 9px; min-height: 48px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; color: var(--muted);
}
.sem b { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600; color: var(--fg); }
.sem small { font-size: 0.68rem; }
.sem[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
.sem[aria-pressed="true"] b { color: var(--accent); }
.nota { color: var(--muted); font-size: 0.88rem; margin: 0 0 12px; }
.nota strong { color: var(--fg); font-weight: 600; }

/* ---------- turnos ---------- */
.turnos { display: flex; flex-direction: column; gap: 10px; }
.turno {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  display: grid; grid-template-columns: 58px minmax(0, 1fr);
}
.turno.n-error { border-color: var(--err); }
.hora {
  border-right: 1px solid var(--line); padding: 12px 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
.hora b { font-size: 1.05rem; font-weight: 600; }
.hora span { font-size: 0.78rem; color: var(--muted); }
.hora i { width: 1px; flex: 1; min-height: 8px; background: var(--line); }
.cuerpo { padding: 10px 12px 8px; min-width: 0; }
.cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 26px; }
.estado { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.estado.ok { color: var(--ok); }
.estado.warn { color: var(--warn); }
.estado.error { color: var(--err); }
.cupos { display: flex; gap: 3px; flex: 0 0 auto; }
.cupos i { width: 14px; height: 6px; border-radius: 3px; background: var(--sunken); border: 1px solid var(--line); }
.cupos i.on { border-color: transparent; background: var(--muted); }
.cupos.ok i.on { background: var(--ok); }
.cupos.warn i.on { background: var(--warn); }
.cupos.error i.on { background: var(--err); }

.gente { list-style: none; margin: 4px 0 0; padding: 0; }
.gente li { display: flex; align-items: center; gap: 8px; min-height: 46px; border-top: 1px solid var(--line); }
.gente li:first-child { border-top: 0; }
.nom { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.nom.tachado { text-decoration: line-through; color: var(--muted); font-weight: 400; }
.rol {
  flex: 0 0 auto; font-size: 0.74rem; font-weight: 600; border-radius: 999px; padding: 0 10px; min-height: 28px;
  display: inline-flex; align-items: center; border: 1px solid transparent;
}
.rol.fijo { background: var(--accent-soft); color: var(--accent); }
.rol.reemplazo { background: transparent; color: var(--muted); border-color: var(--line); }
.rol.aus { background: var(--err-bg); color: var(--err); }
button.rol { cursor: pointer; min-height: 32px; }
.accion {
  flex: 0 0 auto; background: none; border: 0; cursor: pointer; min-height: 44px; padding: 0 4px 0 8px;
  font-size: 0.84rem; font-weight: 600; color: var(--muted);
}
.accion.peligro { color: var(--err); }
.accion.acento { color: var(--accent); }
.x { flex: 0 0 auto; width: 40px; min-height: 44px; background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 1.15rem; }
.vacio { color: var(--muted); font-size: 0.9rem; margin: 6px 0; }
.sumar {
  width: 100%; margin: 4px 0 4px; min-height: 42px; border-radius: 10px; cursor: pointer;
  border: 1.5px dashed var(--line); background: transparent; color: var(--accent); font-weight: 600; font-size: 0.9rem;
  text-align: left; padding: 0 12px;
}

/* ---------- hermanos ---------- */
.buscar { position: relative; margin-bottom: 10px; }
.buscar svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; margin-top: -9px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.buscar input { padding-left: 38px; }
input[type="text"], input[type="search"], input[type="tel"], input[type="email"], select {
  font: inherit; width: 100%; min-height: 46px; padding: 0 12px;
  color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
.conteo { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 4px 2px 8px; }
.filas { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.fila-h {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;
  background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 12px; min-height: 60px;
}
.fila-h:first-child { border-top: 0; }
.ini {
  flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 0.85rem;
}
.fila-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fila-txt b { font-weight: 600; overflow-wrap: anywhere; }
.fila-txt span { color: var(--muted); font-size: 0.84rem; overflow-wrap: anywhere; }
.chev { flex: 0 0 auto; color: var(--muted); font-size: 1.2rem; }

.ficha-cab { display: flex; align-items: center; gap: 14px; margin: 4px 0 14px; }
.ficha-cab .ini { width: 56px; height: 56px; font-size: 1.15rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.chip.acento { background: var(--accent-soft); color: var(--accent); }
.bloque { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; }
.dato { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; padding: 12px; border-top: 1px solid var(--line); align-items: center; }
.dato:first-child { border-top: 0; }
.dato dt { color: var(--muted); font-size: 0.86rem; }
.dato dd { margin: 0; overflow-wrap: anywhere; user-select: text; }
.dato dd.sin { color: var(--muted); }
.bloque-tit { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 18px 2px 8px; }
.linea-turno { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.linea-turno:first-child { border-top: 0; }
.linea-turno span { min-width: 0; }
.linea-turno small { color: var(--muted); font-family: var(--font-mono); margin-left: 6px; }
.btn-fila {
  width: 100%; text-align: left; background: none; border: 0; cursor: pointer; padding: 12px; min-height: 48px;
  display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--accent); font-weight: 600;
}
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.btn {
  border: 0; border-radius: 12px; min-height: 48px; padding: 0 16px; cursor: pointer; font-weight: 600;
  background: var(--accent); color: var(--accent-fg);
}
.btn.sec { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btn.peligro { background: var(--err-bg); color: var(--err); }
.btn.peligro-fuerte { background: var(--err); color: var(--surface); }
.aviso-borrar { margin-top: 16px; background: var(--err-bg); color: var(--err); border-radius: 12px; padding: 12px; font-size: 0.9rem; }
.aviso-borrar .dos { margin-top: 10px; }

/* ---------- resumen ---------- */
.fila-pend, .fila-rank {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer;
  background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 12px; min-height: 54px;
}
.bloque > :first-child { border-top: 0; }
.pend-fecha { display: flex; flex-direction: column; width: 64px; flex: 0 0 auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.pend-fecha small { color: var(--muted); font-size: 0.78rem; }
.pend-chips { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.pchip { font-family: var(--font-mono); font-size: 0.74rem; font-weight: 600; padding: 3px 7px; border-radius: 6px; background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
.pchip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.pchip.error { background: var(--err-bg); color: var(--err); border-color: transparent; }
.leyenda { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; margin: 8px 2px 0; }
.pend-chips { align-items: flex-start; }
.pchip { line-height: 1.3; }
.leyenda .pchip { font-family: var(--font-body); font-weight: 500; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile-tit { font-size: 0.84rem; color: var(--muted); font-weight: 600; }
.tile-num { font-family: var(--font-mono); font-size: 2rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.tile-num small { font-size: 1rem; color: var(--muted); margin-left: 2px; }
.tile-num.sin { color: var(--muted); }
.tile-det { font-size: 0.8rem; color: var(--muted); }
.medidor { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.medidor i { display: block; height: 100%; border-radius: 3px; background: var(--muted); }
.medidor i.ok { background: var(--ok); }
.medidor i.warn { background: var(--warn); }
.medidor i.error { background: var(--err); }
.rank-nom { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.rank-nom .mono { font-family: var(--font-mono); color: var(--muted); font-size: 0.8rem; margin-left: 4px; }
.rank-bar { width: 72px; flex: 0 0 auto; height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.rank-bar i { display: block; height: 100%; background: var(--err); border-radius: 3px; }
.rank-n { flex: 0 0 auto; font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }

/* ---------- formulario ---------- */
.form { display: flex; flex-direction: column; gap: 14px; }
.grupo { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.grupo-tit { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.par { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
label.campo { font-size: 0.84rem; color: var(--muted); display: flex; flex-direction: column; gap: 5px; min-width: 0; }
label.campo input, label.campo select { background: var(--bg); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 10px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 7px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg input:checked + label { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
.seg input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 0.9rem; min-height: 38px; padding: 0 14px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg);
}
.tag[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.agregar-a-lista { display: flex; gap: 8px; }
.agregar-a-lista input { flex: 1; min-width: 0; background: var(--bg); }
.agregar-a-lista .btn { flex: 0 0 auto; min-height: 46px; font-size: 0.9rem; border-radius: 10px; }

/* ---------- hoja de búsqueda ---------- */
.hoja { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.hoja-fondo { position: absolute; inset: 0; background: var(--scrim); border: 0; padding: 0; cursor: pointer; }
.hoja-panel {
  position: relative; width: 100%; max-width: 600px; max-height: 88%;
  background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 8px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 10px;
}

  /* ---------- piezas ---------- */

    TURNOS.forEach(function (hora, t) {
      if (suspendido(iso, t)) {
        h += '<article class="turno n-susp" aria-label="Turno de ' + hora + ' suspendido">' + columnaHora(t) +
          '<div class="cuerpo"><div class="cab"><span class="estado">Suspendido por mal clima</span></div>' +
          '<p class="vacio">Los que estaban anotados no tienen que ir.</p>' +
          (aviso === iso + "|" + t
            ? '<div class="aviso-box"><textarea id="aviso-txt" readonly aria-label="Mensaje para WhatsApp">' + esc(textoCancelacion(fecha, t)) + "</textarea>" +
              '<div class="dos" style="margin-top:0"><button class="btn sec" data-act="aviso-cerrar">Cerrar</button><button class="btn" data-act="copiar">Copiar</button></div></div>'
            : '<button class="wa" data-act="aviso" data-turno="' + t + '">' + ICONOS.enviar + "Avisar cancelación</button>") +
          '<button class="sumar" data-act="reactivar" data-turno="' + t + '">Reactivar turno</button></div></article>';
        return;
      }
      var filas = plantel(iso, sem, t), pres = presentes(filas);
      var est = estado(pres.map(function (x) { return x.p; }));
      h += '<article class="turno' + (est.nivel === "error" ? " n-error" : "") + '" aria-label="Turno de ' + hora + '">' + columnaHora(t);
      h += '<div class="cuerpo"><div class="cab"><span class="estado ' + est.nivel + '">' + esc(est.texto) + "</span>" + cupos(pres.length, est.nivel) + "</div>";
      if (filas.length) {
        h += '<ul class="gente">';
        filas.forEach(function (x) {
          var nom = esc(completo(x.p));
          if (x.tipo === "extra") {
            h += '<li><span class="nom">' + nom + '</span><span class="rol reemplazo">Reemplazo</span>' +
              '<button class="x" data-act="quitar-exc" data-id="' + x.excId + '" aria-label="Quitar a ' + nom + '">×</button></li>';
          } else if (x.ausente) {
            h += '<li><span class="nom tachado">' + nom + '</span><span class="rol aus">No viene</span>' +
              '<button class="accion acento" data-act="quitar-exc" data-id="' + x.excId + '">Deshacer</button></li>';
          } else {
            h += '<li><span class="nom">' + nom + '</span><span class="rol fijo">Fijo</span>' +
              '<button class="accion peligro" data-act="ausente" data-pid="' + x.p.id + '" data-turno="' + t + '">No viene</button></li>';
          }
        });
        h += "</ul>";
      } else {
        h += '<p class="vacio">Nadie asignado.</p>';
      }
      if (pres.length < MAX) {
        var libres = MAX - pres.length;
        h += '<button class="sumar" data-act="abrir-extra" data-turno="' + t + '">+ Agregar reemplazo <span style="color:var(--muted);font-weight:500">· ' + libres + (libres === 1 ? " libre" : " libres") + "</span></button>";
      }
      h += '<button class="link-susp" data-act="suspender" data-turno="' + t + '">Suspender por mal clima</button>';
      h += "</div></article>";
    });
    return h + "</div>";
  }

  // Mensaje para el grupo: quiénes van realmente ese sábado (fijos que vienen + reemplazos).
  // Aviso por WhatsApp de un turno suspendido por mal clima.
  function textoCancelacion(f, t) {
    var dia = f.getDate() + " de " + MESES[f.getMonth()];
    var nombres = presentes(plantel(isoFecha(f), semanaDe(f), t)).map(function (x) { return completo(x.p); });
    var txt = "¡Hola, queridos hermanos! ☔\n\nPor el mal clima, el turno de *" + HORAS[t][0] + " a " + HORAS[t][1] +
      " h* del exhibidor en la estación Boulogne de este *sábado " + dia + "* queda suspendido.\n";
    if (nombres.length) txt += "\n" + (nombres.length === 1 ? "No hace falta que vayas, " + nombres[0] : "Los que estaban anotados no tienen que ir: " + nombres.join(", ")) + ".\n";
    return txt + "\n¡Cuídense mucho y gracias por su disposición! Un abrazo grande.";
  }

  /* ---------- sección Fijos ---------- */
  function vistaFijos() {
    var h = top("Se repiten cada mes", "Turnos fijos");
    h += '<div class="semanas" role="group" aria-label="Sábado del mes">';
    for (var n = 1; n <= 5; n++) {
      h += '<button class="sem" data-act="sem" data-v="' + n + '" aria-pressed="' + (semFijos === n) + '" aria-label="' + SABADOS[n - 1] + '"><b>' + ORD[n - 1] + "</b><small>sábado</small></button>";
    }
    h += "</div>";
    h += '<p class="nota">Quiénes van siempre el ' + SABADOS[semFijos - 1] + " de cada mes.</p>";

    var asigs = state.asigs.filter(function (a) { return a.semana === semFijos; });
    h += '<div class="turnos">';
    TURNOS.forEach(function (hora, t) {
      var del = asigs.filter(function (a) { return a.turno === t; });
      var personas = del.map(function (a) { return pub(a.publicador_id); }).filter(Boolean);
      var est = estado(personas);
      var txt = del.length ? del.length + (del.length === 1 ? " fijo" : " fijos") : "Sin fijos";
      h += '<article class="turno' + (est.nivel === "error" ? " n-error" : "") + '" aria-label="Turno de ' + hora + '">' + columnaHora(t);
      h += '<div class="cuerpo"><div class="cab"><span class="estado ' + (est.nivel === "error" ? "error" : "") + '">' + (est.nivel === "error" ? esc(est.texto) : txt) + "</span>" + cupos(del.length, est.nivel) + "</div>";
      if (del.length) {
        h += '<ul class="gente">';
        del.forEach(function (a) {
          var p = pub(a.publicador_id);
          if (!p) return;
          var nom = esc(completo(p));
          h += '<li><span class="nom">' + nom + "</span>" +
            '<button class="x" data-act="quitar" data-id="' + a.id + '" aria-label="Quitar a ' + nom + '">×</button></li>';
        });
        h += "</ul>";
      }
      if (del.length < MAX) h += '<button class="sumar" data-act="abrir-turno" data-turno="' + t + '">+ Agregar fijo</button>';
      h += "</div></article>";
    });
    return h + "</div>";
  }

  /* ---------- sección Resumen ---------- */
  function fechaCorta(f) { return f.getDate() + " " + MES_C[f.getMonth()]; }

  // Cada turno activo de un sábado con su estado real ese día.
  function turnosDe(f) {
    var iso = isoFecha(f), sem = semanaDe(f), out = [];
    TURNOS.forEach(function (h, t) {
      if (suspendido(iso, t)) return;
      out.push({ f: f, t: t, sem: sem, est: estado(presentes(plantel(iso, sem, t)).map(function (x) { return x.p; })) });
    });
    return out;
  }
  function sabadosDelMes(y, m) {
    var r = [];
    for (var n = 1; n <= 5; n++) { var f = nthSat(y, m, n); if (f) r.push(f); }
    return r;
  }
  function cobertura(y, m) {
    var tot = 0, ok = 0;
    sabadosDelMes(y, m).forEach(function (f) {
      if (isoFecha(f) < state.inicio) return; // antes de usar la app no hay datos
      turnosDe(f).forEach(function (x) { tot++; if (x.est.nivel === "ok") ok++; });
    });
    return { tot: tot, ok: ok, pct: tot ? Math.round(ok * 100 / tot) : null };
  }

  function vistaResumen() {
    var hoy = hoy0(), desde3 = isoFecha(sumarDias(hoy, -91));
    var inicioTxt = (function () { var z = state.inicio.split("-"); return +z[2] + " de " + MESES[+z[1] - 1]; })();
    var h = top("Exhibidor Boulogne", "Resumen");

    // 2. Cobertura
    var m0 = cobertura(hoy.getFullYear(), hoy.getMonth());
    var m1 = cobertura(hoy.getFullYear(), hoy.getMonth() - 1);
    var mesAnt = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1);
    function tile(nombre, c) {
      var t = '<div class="tile"><span class="tile-tit">' + nombre + "</span>";
      if (c.pct === null) return t + '<span class="tile-num sin">—</span><span class="tile-det">Sin datos</span></div>';
      var niv = c.pct >= 90 ? "ok" : c.pct >= 70 ? "warn" : "error";
      return t + '<span class="tile-num">' + c.pct + '<small>%</small></span>' +
        '<span class="medidor"><i class="' + niv + '" style="width:' + c.pct + '%"></i></span>' +
        '<span class="tile-det">' + c.ok + " de " + c.tot + " turnos cubiertos</span></div>";
    }
    h += '<p class="bloque-tit" style="margin-top:6px">Cobertura</p><div class="tiles">' +
      tile(MESES[hoy.getMonth()].charAt(0).toUpperCase() + MESES[hoy.getMonth()].slice(1), m0) +
      tile(MESES[mesAnt.getMonth()].charAt(0).toUpperCase() + MESES[mesAnt.getMonth()].slice(1), m1) + "</div>";

    // 1. Próximas 4 semanas, agrupado por sábado
    var ps = proximoSabado(), grupos = [];
    for (var w = 0; w < 4; w++) {
      var fw = sumarDias(ps, w * 7);
      var malos = turnosDe(fw).filter(function (x) { return x.est.nivel !== "ok"; });
      if (malos.length) grupos.push({ f: fw, malos: malos });
    }
    h += '<p class="bloque-tit">Para resolver · próximas 4 semanas</p><div class="bloque">';
    if (!grupos.length) h += '<div class="linea-turno"><span class="estado ok">Todo cubierto. No hay nada pendiente.</span></div>';
    grupos.forEach(function (g) {
      h += '<button class="fila-pend" data-act="ir-turno" data-v="' + isoFecha(g.f) + '" data-turno="' + g.malos[0].t + '">' +
        '<span class="pend-fecha"><b>' + fechaCorta(g.f) + "</b><small>" + ORD[semanaDe(g.f) - 1] + " sáb</small></span>" +
        '<span class="pend-chips">' + g.malos.map(function (x) {
          return '<span class="pchip ' + (x.est.nivel || "vacio") + '" title="' + esc(x.est.texto) + '">' + HORAS[x.t][0] + "–" + HORAS[x.t][1] + "</span>";
        }).join("") + '</span><span class="chev">›</span></button>';
    });
    h += "</div>";
    if (grupos.length) h += '<p class="leyenda"><span class="pchip vacio">sin cubrir</span><span class="pchip warn">falta gente</span><span class="pchip error">pareja no válida</span></p>';

    // 3. Ausencias por hermano (últimos 3 meses)
    var aus = {};
    state.exc.forEach(function (e) { if (e.tipo === "ausente" && e.fecha >= desde3) aus[e.publicador_id] = (aus[e.publicador_id] || 0) + 1; });
    var rank = Object.keys(aus).map(function (id) { return { p: pub(id), n: aus[id] }; }).filter(function (x) { return x.p; })
      .sort(function (a, b) { return b.n - a.n; }).slice(0, 6);
    h += '<p class="bloque-tit">Más ausencias · últimos 3 meses</p><div class="bloque">';
    if (!rank.length) h += '<div class="linea-turno"><span class="vacio">Nadie faltó a su turno fijo.</span></div>';
    var maxA = rank.length ? rank[0].n : 1;
    rank.forEach(function (x) {
      h += '<button class="fila-rank" data-act="ficha-desde" data-id="' + x.p.id + '"><span class="rank-nom">' + esc(completo(x.p)) + "</span>" +
        '<span class="rank-bar"><i style="width:' + Math.round(x.n * 100 / maxA) + '%"></i></span><span class="rank-n">' + x.n + "</span></button>";
    });
    h += "</div>";

    // 5. Turnos que más fallan (sábados ya pasados desde que se usa la app)
    var fallas = {}, f = proximoSabado();
    if (isoFecha(f) === isoFecha(hoy)) f = sumarDias(f, 7); // el sábado de hoy todavía no terminó
    for (f = sumarDias(f, -7); isoFecha(f) >= state.inicio && isoFecha(f) >= desde3; f = sumarDias(f, -7)) {
      turnosDe(f).forEach(function (x) {
        if (x.est.nivel === "ok") return;
        var k = x.sem + "|" + x.t;
        fallas[k] = (fallas[k] || 0) + 1;
      });
    }
    var rf = Object.keys(fallas).map(function (k) { var z = k.split("|"); return { sem: +z[0], t: +z[1], n: fallas[k] }; })
      .sort(function (a, b) { return b.n - a.n; }).slice(0, 5);
    h += '<p class="bloque-tit">Turnos que más quedaron sin cubrir</p><div class="bloque">';
    if (!rf.length) h += '<div class="linea-turno"><span class="vacio">Todavía no hay sábados pasados para comparar. Se cuenta desde el ' + inicioTxt + ".</span></div>";
    rf.forEach(function (x) {
      h += '<button class="fila-rank" data-act="ir-fijo" data-v="' + x.sem + '"><span class="rank-nom">' + SABADOS[x.sem - 1] +
        ' <small class="mono">' + HORAS[x.t][0] + "–" + HORAS[x.t][1] + 'h</small></span><span class="rank-n">' + x.n + (x.n === 1 ? " vez" : " veces") + "</span></button>";
    });
    h += "</div>";
    h += '<p class="nota" style="margin-top:12px">Los números se cuentan desde el ' + inicioTxt + ", cuando empezaste a usar la app.</p>";
    return h;
  }

  /* ---------- sección Hermanos ---------- */
  function listaHTML() {
    var vis = state.pubs.filter(function (p) { return !filtro || coincide(p, filtro); });
    var h = '<p class="conteo">' + (filtro ? vis.length + " de " + state.pubs.length : state.pubs.length) + " hermanos</p>";
    if (!state.pubs.length) return h + '<p class="vacio">Todavía no cargaste a nadie. Tocá “+ Nuevo” para empezar.</p>';
    if (!vis.length) return h + '<p class="vacio">Nadie coincide con “' + esc(filtro) + '”.</p>';
    h += '<div class="filas">';
    vis.forEach(function (p) {
      var d = detalle(p);
      h += '<button class="fila-h" data-act="ficha" data-id="' + p.id + '"><span class="ini">' + esc(iniciales(p)) + "</span>" +
        '<span class="fila-txt"><b>' + esc(completo(p)) + "</b>" + (d ? "<span>" + esc(d) + "</span>" : "") + '</span><span class="chev">›</span></button>';
    });
    return h + "</div>";
  }

  function vistaLista() {
    var h = top("Exhibidor Boulogne", "Hermanos", '<button class="top-btn" data-act="nuevo">+ Nuevo</button>');
    h += '<div class="buscar">' + ICONOS.lupa + '<input type="search" id="filtro" placeholder="Buscar por nombre, congregación, idioma…" aria-label="Buscar hermano" value="' + esc(filtro) + '"></div>';
    return h + '<div id="lista">' + listaHTML() + "</div>";
  }

  function vistaFicha(id) {
    var p = pub(id);
    if (!p) { pantalla = { tipo: "lista" }; return vistaLista(); }
    var c = p.conyuge_id ? pub(p.conyuge_id) : null;
    var h = top("", completo(p), "", "Hermanos");
    h += '<div class="ficha-cab"><span class="ini">' + esc(iniciales(p)) + '</span><div class="chips">';
    h += '<span class="chip">' + (p.genero === "M" ? "Hermano" : "Hermana") + "</span>";
    if (p.privilegio !== "ninguno") h += '<span class="chip acento">' + PRIV[p.privilegio] + "</span>";
    if (p.precursorado !== "no") h += '<span class="chip acento">' + textoPrec(p) + "</span>";
    h += '<span class="chip">' + EXP[p.experiencia] + "</span></div></div>";

    function dato(et, val) { return '<div class="dato"><dt>' + et + "</dt><dd" + (val ? "" : ' class="sin"') + ">" + (val || "Sin cargar") + "</dd></div>"; }
    h += '<dl class="bloque">';
    h += dato("Celular", esc(p.celular));
    h += dato("Mail", esc(p.mail));
    h += dato("Congregación", esc(p.congregacion));
    h += dato("Reemplazos", esc(textoCuenta(contarReemplazos(p.id))));
    h += dato("Idiomas", p.idiomas.length ? '<span class="chips">' + p.idiomas.map(function (l) { return '<span class="chip">' + esc(l) + "</span>"; }).join("") + "</span>" : "");
    h += "</dl>";

    h += '<div class="bloque"><button class="btn-fila" data-act="abrir-conyuge" data-id="' + p.id + '"><span>' +
      (c ? "Cónyuge: " + esc(completo(c)) : "Elegir cónyuge") + "</span><span>›</span></button></div>";

    var suyos = state.asigs.filter(function (a) { return a.publicador_id === p.id; })
      .sort(function (a, b) { return a.semana - b.semana || a.turno - b.turno; });
    h += '<p class="bloque-tit">Turnos fijos</p><div class="bloque">';
    if (!suyos.length) h += '<div class="linea-turno"><span class="vacio">No está en ningún turno.</span></div>';
    suyos.forEach(function (a) {
      h += '<div class="linea-turno"><span>' + SABADOS[a.semana - 1] + "<small>" + HORAS[a.turno][0] + "–" + HORAS[a.turno][1] + 'h</small></span></div>';
    });
    h += "</div>";

    if (confirmar) {
      h += '<div class="aviso-borrar">¿Borrar a ' + esc(completo(p)) + '? También se quita de todos los turnos.' +
        '<div class="dos"><button class="btn sec" data-act="borrar-no">Cancelar</button><button class="btn peligro-fuerte" data-act="borrar-si" data-id="' + p.id + '">Sí, borrar</button></div></div>';
    } else {
      h += '<div class="dos"><button class="btn peligro" data-act="borrar-pedir">Borrar</button><button class="btn" data-act="editar" data-id="' + p.id + '">Editar</button></div>';
    }
    return h;
  }

  function opciones(map, actual) {
    return Object.keys(map).map(function (k) {
      return '<option value="' + k + '"' + (k === actual ? " selected" : "") + ">" + map[k] + "</option>";
    }).join("");
  }

    h += '<label class="campo" for="f-celular">Celular<input type="tel" id="f-celular" inputmode="tel" value="' + esc(v.celular) + '"></label>';
    h += '<label class="campo" for="f-mail">Mail<input type="email" id="f-mail" inputmode="email" value="' + esc(v.mail) + '"></label></div>';

    h += '<div class="grupo"><span class="grupo-tit">Congregación y servicio</span>';

  /* ---------- hoja de búsqueda ---------- */
  function vistaPicker() {

  }
  function llenarPicker(q) {
    var ul = document.getElementById("picker-lista");
    if (!ul || !picker) return;
    var items = picker.fuente().filter(function (it) { return !q || coincide(it.p, q); });
    var h = "";
    if (picker.sinOpcion && !q) {
      h += '<li><button class="res" data-act="pick" data-id=""><span class="fila-txt"><b>' + esc(picker.sinOpcion) + "</b></span></button></li>";
    }
    items.forEach(function (it) {
      var d = detalle(it.p);
      h += '<li><button class="res" data-act="pick" data-id="' + it.p.id + '"><span class="ini">' + esc(iniciales(it.p)) + '</span><span class="fila-txt"><b>' + esc(completo(it.p)) + "</b>" +
        (d ? "<span>" + esc(d) + "</span>" : "") + (it.info ? '<span class="res-info">' + esc(it.info) + "</span>" : "") + (it.tag ? '<span class="res-tag">' + esc(it.tag) + "</span>" : "") + "</span></button></li>";
    });
    if (!items.length) h += '<li class="res-sin">Nadie coincide con la búsqueda.</li>';
    ul.innerHTML = h;
  }

  function abrirTurno(turno) {
    var semana = semFijos;
    picker = {
      titulo: SABADOS[semana - 1] + " · " + TURNOS[turno],
      fuente: function () {
        var enEste = {}, enOtro = {};
        state.asigs.forEach(function (a) {
          if (a.semana !== semana) return;
          if (a.turno === turno) enEste[a.publicador_id] = true; else enOtro[a.publicador_id] = true;
        });
        return state.pubs.filter(function (p) { return !enEste[p.id]; }).map(function (p) {
          return { p: p, tag: enOtro[p.id] ? "Ya tiene otro turno ese sábado" : "" };
        });
      },
      elegir: function (id) { if (id) agregarAsig(semana, turno, id); }
    };
    render();
  }
  function abrirExtra(turno) {
    var f = fecha, iso = isoFecha(f), semana = semanaDe(f);
    picker = {
      titulo: "Reemplazo · " + f.getDate() + " de " + MESES[f.getMonth()] + " · " + TURNOS[turno],
      fuente: function () {
        var aqui = {}, otros = {};
        plantel(iso, semana, turno).forEach(function (x) { aqui[x.p.id] = true; });
        TURNOS.forEach(function (h, t) {
          if (t !== turno) presentes(plantel(iso, semana, t)).forEach(function (x) { otros[x.p.id] = true; });
        });
        return state.pubs.filter(function (p) { return !aqui[p.id]; }).map(function (p) {
          var n = contarReemplazos(p.id);
          return { p: p, n: n, info: textoCuenta(n), tag: otros[p.id] ? "Ya tiene otro turno ese día" : "" };
        }).sort(function (a, b) { return a.n - b.n; }); // primero los que menos cubrieron
      },
      elegir: function (id) { if (id) agregarExtra(iso, semana, turno, id); }
    };
    render();
  }
  function abrirConyuge(id) {
    var yo = pub(id);
    if (!yo) return;
    picker = {
      titulo: "Cónyuge de " + completo(yo),
      sinOpcion: yo.conyuge_id ? "Quitar cónyuge" : "",
      fuente: function () {
        return state.pubs.filter(function (o) { return o.id !== id && o.genero !== yo.genero; }).map(function (o) {
          var otro = o.conyuge_id && o.conyuge_id !== id ? pub(o.conyuge_id) : null;
          return { p: o, tag: otro ? "Hoy figura con " + completo(otro) : "" };
        });
      },
      elegir: function (nuevo) { setConyuge(id, nuevo || null); }
    };
    render();
  }

  /* ---------- render ---------- */
  function nav() {
    var items = [["sabados", "Sábados"], ["fijos", "Fijos"], ["hermanos", "Hermanos"], ["resumen", "Resumen"]];
    var h = '<nav class="nav" aria-label="Secciones"><div class="nav-in">';
    items.forEach(function (it) {
      h += '<button class="nav-btn" data-act="tab" data-v="' + it[0] + '"' + (tab === it[0] ? ' aria-current="page"' : "") + '><span class="nav-ico">' + ICONOS[it[0]] + "</span>" + it[1] + "</button>";
    });
    return h + "</div></nav>";
  }

  function render() {
    var h;
    if (tab === "sabados") h = vistaSabados();
    else if (tab === "fijos") h = vistaFijos();
    else if (tab === "resumen") h = vistaResumen();
    else if (pantalla.tipo === "ficha") h = vistaFicha(pantalla.id);
    else if (pantalla.tipo === "form") h = vistaForm();
    else h = vistaLista();
    h += nav();
    if (toast) h += '<div class="toast' + (toast.err ? " err" : "") + '" id="toast" role="status">' + esc(toast.texto) + "</div>";
    h += vistaPicker();
    app.innerHTML = h;
    if (picker) {
      llenarPicker("");
      var q = document.getElementById("picker-q");
      if (q) q.focus();
    }
    if (tab === "sabados") {
      var sel = app.querySelector('.dia[aria-pressed="true"]');
      if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: "nearest", inline: "center" });
    }
  }
  function cambio() { guardar(); render(); }
  function irArriba() { window.scrollTo(0, 0); }

  function borrador() {
    if (pantalla.tipo !== "form") return;
    function v(id) { var e = document.getElementById(id); return e ? e.value : ""; }
    var gF = document.getElementById("g-f");
    pantalla.draft = {
      nombre: v("f-nombre"), apellido: v("f-apellido"), genero: gF && gF.checked ? "F" : "M",
      celular: v("f-celular"), mail: v("f-mail"), congregacion: v("f-cong"),
      privilegio: v("f-priv") || "ninguno", precursorado: v("f-prec") || "no", experiencia: v("f-exp") || "comun"
    };
  }

  /* ---------- eventos ---------- */
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    var id = b.getAttribute("data-id");
    if (act !== "tag-idioma") { toast = null; }

    if (act === "tab") {
      var v = b.getAttribute("data-v");
      if (tab === v && v === "hermanos") pantalla = { tipo: "lista" };
      tab = v; picker = null; confirmar = false;
      render(); irArriba();
    } else if (act === "fecha") {
      var pz = b.getAttribute("data-v").split("-");
      fecha = new Date(+pz[0], +pz[1] - 1, +pz[2]); render();
    } else if (act === "ir-turno") {
      var zz = b.getAttribute("data-v").split("-");
      fecha = new Date(+zz[0], +zz[1] - 1, +zz[2]); tab = "sabados"; render();
      var art = app.querySelectorAll(".turnos .turno")[+b.getAttribute("data-turno")];
      if (art) art.scrollIntoView({ block: "center" }); else irArriba();
    } else if (act === "ir-fijo") {
      semFijos = +b.getAttribute("data-v"); tab = "fijos"; render(); irArriba();
    } else if (act === "ficha-desde") {
      tab = "hermanos"; pantalla = { tipo: "ficha", id: id }; confirmar = false; render(); irArriba();
    } else if (act === "aviso") {
      aviso = isoFecha(fecha) + "|" + b.getAttribute("data-turno"); render();
      var ta = document.getElementById("aviso-txt");
      if (ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; }
    } else if (act === "aviso-cerrar") {
      aviso = null; render();
    } else if (act === "copiar") {
      var txt = document.getElementById("aviso-txt");
      var marcar = function () { txt.focus(); txt.select(); avisar("Mantené apretado el texto y elegí Copiar.", true); render(); var t2 = document.getElementById("aviso-txt"); if (t2) { t2.focus(); t2.select(); } };
      try {
        navigator.clipboard.writeText(txt.value).then(function () { avisar("Copiado. Ya lo podés pegar en WhatsApp."); render(); }, marcar);
      } catch (err) { marcar(); }
    } else if (act === "suspender") {
      state.susp[isoFecha(fecha) + "|" + b.getAttribute("data-turno")] = true; cambio();
    } else if (act === "reactivar") {
      delete state.susp[isoFecha(fecha) + "|" + b.getAttribute("data-turno")]; aviso = null; cambio();
    } else if (act === "sem") {
      semFijos = parseInt(b.getAttribute("data-v"), 10); render();
    } else if (act === "ausente") {
      marcarAusente(isoFecha(fecha), semanaDe(fecha), parseInt(b.getAttribute("data-turno"), 10), b.getAttribute("data-pid")); cambio();
    } else if (act === "quitar-exc") {
      quitarExc(id); cambio();
    } else if (act === "abrir-extra") {
      abrirExtra(parseInt(b.getAttribute("data-turno"), 10));
    } else if (act === "abrir-turno") {
      abrirTurno(parseInt(b.getAttribute("data-turno"), 10));
    } else if (act === "quitar") {
      quitarAsig(id); cambio();
    } else if (act === "rol") {
      alternarRol(id); cambio();
    } else if (act === "abrir-conyuge") {
      abrirConyuge(id);
    } else if (act === "pick") {
      var fn = picker && picker.elegir;
      picker = null;
      if (fn) fn(id);
      cambio();
    } else if (act === "cerrar-picker") {
      picker = null; render();
    } else if (act === "ficha") {
      pantalla = { tipo: "ficha", id: id }; confirmar = false; render(); irArriba();
    } else if (act === "nuevo") {
      pantalla = { tipo: "form", id: null, idiomas: [] }; render(); irArriba();
      var n = document.getElementById("f-nombre"); if (n) n.focus();
    } else if (act === "editar") {
      var pe = pub(id);
      pantalla = { tipo: "form", id: id, idiomas: pe ? pe.idiomas.slice() : [] }; render(); irArriba();
    } else if (act === "volver") {
      if (pantalla.tipo === "form" && pantalla.id) pantalla = { tipo: "ficha", id: pantalla.id };
      else pantalla = { tipo: "lista" };
      confirmar = false; render(); irArriba();
    } else if (act === "borrar-pedir") {
      confirmar = true; render();
    } else if (act === "borrar-no") {
      confirmar = false; render();
    } else if (act === "borrar-si") {
      var nomB = pub(id) ? completo(pub(id)) : "";
      borrarPub(id); confirmar = false; pantalla = { tipo: "lista" };
      avisar(nomB + " fue borrado."); cambio(); irArriba();
    } else if (act === "tag-idioma") {
      var lang = b.getAttribute("data-v");
      var pos = pantalla.idiomas.indexOf(lang);
      if (pos === -1) pantalla.idiomas.push(lang); else pantalla.idiomas.splice(pos, 1);
      b.setAttribute("aria-pressed", String(pos === -1));
    } else if (act === "idioma-nuevo") {
      borrador();
      var ni = document.getElementById("f-nuevo-idioma").value.trim();
      if (ni) {
        var nl = sinRepetir(state.langs, ni);
        if (pantalla.idiomas.indexOf(nl) === -1) pantalla.idiomas.push(nl);
        cambio();
      }
    } else if (act === "cong-nueva") {
      borrador();
      var nc = document.getElementById("f-nueva-cong").value.trim();
      if (nc) { pantalla.draft.congregacion = sinRepetir(state.congs, nc); cambio(); }
    } else if (act === "vaciar") {
      state = { pubs: [], asigs: [], exc: [], susp: {}, inicio: isoFecha(hoy0()), congs: [], langs: IDIOMAS_BASE.slice(), ejemplo: false };
      pantalla = { tipo: "lista" }; cambio();
    } else if (act === "quedarme") {
      state.ejemplo = false; cambio();
    }
  });

  app.addEventListener("input", function (e) {
    var el = e.target;
    if (el.id === "picker-q") llenarPicker(el.value);
    else if (el.id === "filtro") {
      filtro = el.value;
      var cont = document.getElementById("lista");
      if (cont) cont.innerHTML = listaHTML();
    }
  });

  app.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id !== "form-pub") return;
    function val(i) { return document.getElementById(i).value.trim(); }
    var nombre = val("f-nombre");
    if (!nombre) {
      borrador(); avisar("Escribí al menos el nombre.", true); render();
      var n = document.getElementById("f-nombre"); if (n) n.focus();
      return;
    }
    var datos = {
      nombre: nombre, apellido: val("f-apellido"),
      genero: document.getElementById("g-f").checked ? "F" : "M",
      celular: val("f-celular"), mail: val("f-mail"), congregacion: document.getElementById("f-cong").value,
      privilegio: document.getElementById("f-priv").value,
      precursorado: document.getElementById("f-prec").value,
      experiencia: document.getElementById("f-exp").value,
      idiomas: pantalla.idiomas.slice()
    };
    var destino;
    if (pantalla.id) {
      var p = pub(pantalla.id);
      if (p) {
        if (p.genero !== datos.genero && p.conyuge_id) setConyuge(p.id, null);
        Object.keys(datos).forEach(function (k) { p[k] = datos[k]; });
      }
      destino = pantalla.id;
      avisar("Cambios guardados.");
    } else {
      datos.id = uid(); datos.conyuge_id = null;
      state.pubs.push(base(datos));
      destino = datos.id;
      avisar(completo(datos) + " agregado.");
    }
    ordenar();
    pantalla = { tipo: "ficha", id: destino };
    cambio(); irArriba();
  });

  render();
})();
</script>
